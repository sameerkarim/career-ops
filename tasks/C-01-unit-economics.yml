id: C-01
version: "1.0"
title: subscription-unit-economics
category: C
mode: single_turn
difficulty: standard
est_minutes_human: 40

prompt: |
  The CEO of Brewfolk, a D2C specialty-coffee subscription company, wants a decision
  before Thursday's board meeting: "Marketing wants to double paid-acquisition spend
  next quarter. Do our unit economics support that?"

  The board has set a hurdle: scale paid acquisition only if LTV:CAC ≥ 3.0.

  Current monthly figures per subscriber:
  - Subscription price: €29.00 per month (one box per month)
  - Cost of goods per box: €11.00
  - Fulfillment & shipping per box: €4.50
  - Payment processing: 2.5% of subscription revenue
  - Monthly churn rate: 6.0% (assume constant; treat expected customer lifetime as 1/churn)
  - Fully-loaded CAC on paid channels: €85.00

  Deliverable: (1) monthly contribution margin per subscriber, (2) CAC payback period
  in months, (3) LTV on contribution margin, (4) LTV:CAC ratio, (5) a clear yes/no
  against the board hurdle with the one or two levers that would change the answer,
  including the approximate churn rate at which the hurdle would be met (holding
  everything else constant). Show your arithmetic.

constraints:
  max_words: 500
  format: memo with calculations shown

key:
  required_points:
    - point: "Contribution margin = 29.00 − 11.00 − 4.50 − 0.725 = €12.775 ≈ €12.78/month (payment fee on revenue, not on margin)"
      dimension: rigor
    - point: "Payback = 85 / 12.775 ≈ 6.7 months; LTV = 12.775 × (1/0.06 ≈ 16.67) ≈ €213; LTV:CAC ≈ 2.5"
      dimension: rigor
    - point: "Verdict is a clear NO against the ≥3.0 hurdle as things stand, stated up front"
      dimension: actionability
    - point: "Breakeven churn: hurdle met when 12.775/(churn × 85) ≥ 3 → churn ≤ 12.775/255 ≈ 5.0% — i.e. churn must fall ~1pp (or CAC to ≤ ~€71, or contribution to ≥ ~€15.3)"
      dimension: insight
  common_failures:
    - failure: "Computes LTV on revenue (29 × 16.67 ≈ €483) instead of contribution margin, concluding LTV:CAC ≈ 5.7 and recommending scaling"
      dimension: rigor
    - failure: "Applies the 2.5% payment fee to contribution instead of revenue, or omits it"
      dimension: rigor
    - failure: "Hedges the verdict ('it depends') despite an explicit numeric hurdle and complete data"
      dimension: actionability
  objective:
    type: numeric
    answer: "contribution ≈ €12.78/mo; payback ≈ 6.7 months; LTV ≈ €213; LTV:CAC ≈ 2.5; breakeven churn ≈ 5.0%"
    tolerance: "±5% on each figure; LTV:CAC ±0.1"
  judge_notes: |
    Accept lifetime-value formulations using margin/churn directly
    (12.775/0.06 = €212.9). Discounted-LTV variants are acceptable only if the
    discount rate is stated and the comparison against the hurdle is still made on a
    consistent basis — but the headline answer the board needs is the simple one.
    All four numeric outputs must be present and correct for rigor = 5.
