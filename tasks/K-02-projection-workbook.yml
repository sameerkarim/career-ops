id: K-02
version: "1.0"
title: three-year-projection-workbook-xlsx
category: K
mode: agentic
difficulty: hard
est_minutes_human: 120
deliverable_type: xlsx

prompt: |
  Same engagement as K-01 (Arcadia Analytics, growth-financing prep), but this time
  the CFO wants the actual workbook, not a spec: build the 3-year P&L projection
  model as a real .xlsx file the partner can open and stress-test live.

  Base-case assumptions (FY0 = last actual year):
  - FY0 revenue: €10.0M
  - Revenue growth: 25% p.a. (driver)
  - Gross margin: 70% of revenue (driver)
  - FY0 operating expenses: €6.0M, growing 10% p.a. (driver)
  - Ignore D&A, interest, and tax — EBITDA level only
  - Capex at 3% of revenue as a memo line below EBITDA (not in it)

  Hard requirements for the workbook:
  1. Separate sheets: Inputs (all four drivers, each in exactly one labeled cell),
     Model (FY0–FY3 P&L with EBITDA and EBITDA margin), Sensitivity (FY3 EBITDA
     across growth {20%, 25%, 30%} × gross margin {65%, 70%, 75%}).
  2. Every calculated cell must contain a LIVE formula referencing the Inputs
     sheet (directly or through the Model sheet) — no pasted result values, and
     no numeric constants inside formulas. Changing a driver on Inputs must flow
     through the whole workbook, including the sensitivity grid (e.g. via
     re-derived scenario columns, not hand-typed numbers).
  3. Labels and units on every row; the partner gets no walkthrough.

agentic:
  scaffold: artifact-builder
  tools: [code_execution]
  budget:
    max_tool_calls: 15
    max_minutes: 15
  deliverable: "One .xlsx file saved in the working directory (it is collected automatically), plus a 5-line summary of the structure."

key:
  required_points:
    - point: "Workbook audit shows live formulas (n_formula_cells well above the ~15 calculated cells required) and essentially zero magic numbers in formula cells; drivers exist only on the Inputs sheet"
      dimension: robustness
    - point: "Cross-sheet references present (Model/Sensitivity pulling from Inputs) — the separation is wired, not cosmetic"
      dimension: robustness
    - point: "Formula logic correct: Revenue compounds on growth; Opex compounds at its own rate; EBITDA = Revenue×GM − Opex; capex memo = Revenue×3% excluded from EBITDA; base-case FY3 values consistent with revenue ≈ €19.53M, EBITDA ≈ €5.69M"
      dimension: rigor
    - point: "Sensitivity grid is formula-driven across both axes (3×3), consistent with the objective corners"
      dimension: rigor
    - point: "All three required sheets present, labeled, with units; completion of every stated requirement"
      dimension: completion
  common_failures:
    - failure: "Computes values in Python and writes static numbers into cells (audit shows few/no formulas) — a printout, not a model"
      dimension: robustness
    - failure: "Hardcodes growth/margin constants inside formulas instead of referencing Inputs (audit magic numbers > ~3)"
      dimension: robustness
    - failure: "Sensitivity grid hand-typed from computed results rather than driven by formulas"
      dimension: robustness
  objective:
    type: numeric
    answer: "Base FY3: revenue €19.53M, EBITDA €5.69M; sensitivity corners g20/gm70: €4.11M, g30/gm70: €7.39M, g25/gm65: €4.71M, g25/gm75: €6.66M"
    tolerance: "±2%"
  judge_notes: |
    Use the attached mechanical audit JSON as trusted evidence for `robustness`
    (formula counts, magic numbers, cross-sheet refs, sheet inventory) — it is
    produced by a pinned script, not by a model. openpyxl cannot evaluate
    formulas, so verify numeric correctness by reading the formula chains in the
    trace/summary against the worked solution in K-01's judge notes (same
    numbers). If no audit record is attached, cap robustness at 3 and flag for
    human review. This category is human-primary regardless.
