id: A-01
version: "1.0"
title: margin-compression-issue-tree
category: A
mode: single_turn
difficulty: standard
est_minutes_human: 45

prompt: |
  You are advising the CEO of Meridian Freight, a mid-market road logistics company
  (revenue ~$420M, 1,800 employees, contract logistics and FTL trucking, one country,
  no air/ocean). She says: "Our margins are evaporating and my team gives me a
  different explanation every week. I need to know where to look."

  Facts available:
  - Revenue roughly flat for 2 years ($428M → $421M).
  - EBITDA margin fell from 9.8% to 6.1% over the same period.
  - Fuel is ~22% of costs and has been hedged throughout; hedge gains/losses were minor.
  - Driver wages rose ~11% cumulatively over the 2 years (industry-wide shortage).
  - Customer mix shifted: the 5 largest retail accounts grew from 31% to 44% of
    revenue, on multi-year contracts with strict SLAs and penalty clauses.
  - A new transport-management system (TMS) was rolled out 14 months ago; on-time
    performance improved 3pp since.
  - Salesforce was expanded by 15 heads last year to "win back volume".

  Deliverable: (1) an issue tree decomposing "why has EBITDA margin fallen 3.7pp",
  (2) your top 3 prioritized hypotheses with a one-line rationale each grounded in
  the facts above, and (3) for each hypothesis, the specific analysis you would run
  in week 1 and the data you'd request.

constraints:
  max_words: 700
  format: structured memo

key:
  required_points:
    - point: "Top-level split separates revenue-side effects (price, customer/lane mix) from cost-side effects (driver wages, overhead incl. new sales heads, TMS/one-off costs) — not a generic cost-only tree"
      dimension: structure
    - point: "Identifies the retail-account mix shift (31%→44%) as a likely price/mix driver — large contracted accounts at lower yield plus SLA penalty exposure"
      dimension: insight
    - point: "Quantifies the order of magnitude somewhere: 3.7pp on ~$420M ≈ $15–16M of EBITDA to explain, and sizes hypotheses against it"
      dimension: rigor
    - point: "Week-1 tests are specific and data-grounded (e.g., margin bridge by account/lane, yield per mile by customer cohort, penalty payout history), not 'do a deep dive'"
      dimension: actionability
  common_failures:
    - failure: "Blames fuel despite the brief stating fuel was hedged with minor net effect"
      dimension: rigor
    - failure: "Tree branches overlap (e.g., 'pricing' and 'customer mix' treated as independent additive branches without acknowledging interaction) or omit the cost side entirely"
      dimension: structure
    - failure: "Generic framework dump (Porter, 7S) instead of a tailored profit-driver tree"
      dimension: structure
  judge_notes: |
    Accept either a driver tree (margin = yield − cost per unit, decomposed) or a
    hypothesis tree, provided it is MECE and grounded in the stated facts. The best
    answers note that flat revenue + 15 new sales heads implies either failing
    win-back or price concessions to hold volume — treating SG&A growth as a
    candidate explanation. Do not require that exact observation for a 4, but a 5 on
    insight needs at least one such non-obvious connection.
