# Per-category dimension weights → composite score.
# Composite = Σ(score × weight) / Σ(weight). Weight 0 = dimension not scored.
# Agentic dimensions (sources/efficiency/completion) apply only when the run
# mode is `agentic`, regardless of category; for agentic runs they are added
# with the weights under `agentic_overlay` and the core weights are kept.
#
# Version: 1.0 — pinned per wave; bump on any change.

version: "1.1"

categories:
  A: # Problem framing & structuring
    structure: 0.40
    rigor: 0.15
    insight: 0.20
    communication: 0.10
    actionability: 0.05
    integrity: 0.10
  B: # Market & competitive analysis
    structure: 0.15
    rigor: 0.35
    insight: 0.20
    communication: 0.10
    actionability: 0.05
    integrity: 0.15
  C: # Quantitative & financial reasoning
    structure: 0.10
    rigor: 0.50
    insight: 0.15
    communication: 0.10
    actionability: 0.05
    integrity: 0.10
  D: # Synthesis & executive communication
    structure: 0.15
    rigor: 0.05
    insight: 0.25
    communication: 0.40
    actionability: 0.05
    integrity: 0.10
  E: # Strategic options & recommendation
    structure: 0.15
    rigor: 0.20
    insight: 0.20
    communication: 0.10
    actionability: 0.25
    integrity: 0.10
  F: # Organization, people & change
    structure: 0.10
    rigor: 0.05
    insight: 0.25
    communication: 0.25
    actionability: 0.25
    integrity: 0.10
  G: # Research & due diligence (agentic-first category)
    structure: 0.10
    rigor: 0.20
    insight: 0.20
    communication: 0.15
    actionability: 0.05
    integrity: 0.30
  H: # Data interpretation
    structure: 0.10
    rigor: 0.35
    insight: 0.30
    communication: 0.10
    actionability: 0.05
    integrity: 0.10
  I: # Critique & red-teaming
    structure: 0.10
    rigor: 0.30
    insight: 0.30
    communication: 0.10
    actionability: 0.10
    integrity: 0.10
  J: # Client advisory interaction (multi-turn)
    structure: 0.10
    rigor: 0.10
    insight: 0.20
    communication: 0.30
    actionability: 0.15
    integrity: 0.15
  K: # Financial models & projections (artifact)
    structure: 0.10
    rigor: 0.30
    robustness: 0.30
    insight: 0.05
    communication: 0.05
    actionability: 0.05
    integrity: 0.15
  L: # Presentations & visual communication (artifact)
    structure: 0.10
    rigor: 0.05
    insight: 0.15
    communication: 0.25
    visual_design: 0.30
    actionability: 0.05
    integrity: 0.10
  M: # Project & implementation planning (artifact)
    structure: 0.15
    rigor: 0.15
    robustness: 0.25
    insight: 0.05
    communication: 0.05
    actionability: 0.25
    integrity: 0.10

# Added on top of core weights for mode=agentic runs (then renormalized).
agentic_overlay:
  sources: 0.25
  efficiency: 0.10
  completion: 0.15

# Dimensions where human judgment is primary: judge scores on these are provisional
# (scorecard marks them unvalidated; responses scoring them are always human-reviewed)
# until judge–human Spearman ≥ 0.7 for two consecutive waves. See human-review/protocol.md.
human_primary_dimensions: [robustness, visual_design]

# Hard rules applied after weighting:
gates:
  integrity_cap: # integrity ≤ 2 → composite capped
    threshold: 2
    cap: 2.0
  completion_cap: # agentic runs: completion ≤ 2 → composite capped
    threshold: 2
    cap: 2.5
