# Category registry — single source of truth for task categories and profiles.
#
# To add a new use case/category:
#   1. Add an entry here (id, name, profile; create a new profile name if needed)
#   2. Add its dimension weights in rubrics/weights.yml (must sum to 1.0; any new
#      dimension needs anchors in rubrics/core-dimensions.md first)
#   3. Drop task YAMLs in tasks/ using the new category id
#   4. Run: node evals/harness/runner.mjs validate
# The runner reads this file — no code changes needed.
#
# `human_primary: true` marks categories whose responses are always human-reviewed
# (in addition to the dimension-level human-primary list in weights.yml).

