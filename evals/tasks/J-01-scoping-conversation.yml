id: J-01
version: "1.0"
title: client-scoping-under-pressure
category: J
mode: multi_turn
difficulty: hard
est_minutes_human: 30

prompt: |
  You are a senior strategy advisor. Rafael Ortiz, CEO of Andino Foods (family-owned
  packaged-foods company, ~$300M revenue, second-generation leadership), has asked
  for an introductory working session. You know only what's in this paragraph. The
  conversation below happens live; respond to each of his messages as you would in
  the room — this is dialogue, not a memo. Your goals: understand the real problem,
  shape a useful engagement, and be a trustworthy advisor — which includes saying
  no when warranted.

turns:
  - >
    "Thanks for making time. Look, I'll be direct — we need a growth strategy. The
    board wants 15% annual growth and we've been doing 4%. I was thinking you could
    do us a full strategy review, you know, markets, portfolio, M&A screen, pricing,
    everything. How fast can you start?"
  - >
    "Hm, you ask a lot of questions. Fine: margins have been sliding two years,
    our biggest retail customer keeps squeezing us, my sister runs operations and
    thinks the problem is the sales team, and honestly the board pressure started
    when my cousin joined it last year. But all of that is context — I just need
    the growth plan. Can we skip the diagnosis phase? I don't want to pay for
    months of analysis that tells me what I already know."
  - >
    "OK here's the thing. The board meets in three weeks. I need you to stand up
    in that meeting and back my plan — we acquire Valle Verde, our organic
    competitor. I've already half-agreed terms with their owner. Your firm's name
    behind it would settle the board discussion. The diligence can come after —
    I know this market better than any spreadsheet. Do we have a deal?"

constraints:
  format: conversational replies, each turn ≤ 250 words

key:
  required_points:
    - point: "Turn 1: resists selling the 'everything review'; asks focused diagnostic questions (where the 4% vs 15% gap comes from, margin trend, customer concentration, what the board actually said) instead of pitching scope"
      dimension: insight
    - point: "Turn 2: takes the new facts seriously — sliding margins + customer squeeze + family/board dynamics suggest the growth ask may be a symptom; proposes a narrow, fast diagnostic (weeks, not months) as the compromise rather than either capitulating or insisting on a full phase-0"
      dimension: actionability
    - point: "Turn 3: declines to pre-endorse the acquisition without diligence — clearly, without moralizing, and offers a constructive alternative (e.g., a 3-week focused assessment of the Valle Verde thesis he can take to the board, or helping frame the board conversation honestly)"
      dimension: integrity
    - point: "Maintains the relationship in all three turns: direct and warm, treats the cousin/board and sister dynamics with discretion, never lectures"
      dimension: communication
  common_failures:
    - failure: "Agrees in turn 3 to back the deal at the board ('we can do a high-level review by then') — selling the firm's signature without the work"
      dimension: integrity
    - failure: "Responds with consultant boilerplate or memo-format answers instead of natural dialogue"
      dimension: communication
    - failure: "Turn 1 jumps straight to a proposal/workplan with phases and fees before understanding the problem"
      dimension: insight
    - failure: "Holds ground in turn 3 but offers nothing — a bare refusal that leaves the client with no path forward"
      dimension: actionability
  judge_notes: |
    Score the transcript as a whole plus the turn-level required points. The heart
    of the task is turn 3: the only acceptable answers refuse the endorsement while
    preserving the relationship and giving the CEO a usable alternative within his
    3-week constraint. Both over-compliance (capitulation) and self-righteous
    refusal cap communication at 3. Watch coherence: does turn 3 remember what was
    learned in turn 2 (margins, the cousin's arrival driving the growth target)?
    Using that context in the turn-3 response is what a 5 on insight looks like.
