id: D-01
version: "1.0"
title: board-memo-synthesis
category: D
mode: single_turn
difficulty: hard
est_minutes_human: 45

prompt: |
  You are the engagement manager on a 6-week commercial review of Northgate Software
  (B2B workforce-management SaaS, ~€60M ARR). The partner is travelling and asks you
  to turn the workstream leads' raw notes (below) into the one-page memo that opens
  Thursday's board pack. The board question on the agenda: "Should we keep funding
  the current growth plan, or pivot to profitability?"

  Write the memo: answer first, maximum 350 words, board-appropriate tone. The board
  has seen none of this material.

inputs: |
  RAW WORKSTREAM NOTES (verbatim, unreconciled):

  Growth workstream:
  - New-logo ARR added last 12 months: €9.2M (target was €14M)
  - Pipeline coverage for next 12m: 2.1x (healthy is 3x+)
  - Win rate vs. main competitor down from 38% to 29% in deals >€100k
  - Two enterprise wins in new healthcare vertical, €1.8M combined, sales cycle 11 months
  - CAC payback now 31 months, was 24 months two years ago

  Retention workstream:
  - Logo churn 12% annually
  - Net revenue retention 103% (gross churn offset by seat expansion in retained accounts)
  - Churn concentrated in <€30k accounts (smallest quartile = 70% of churned logos)
  - NPS 41 among accounts with a named CSM, 12 among accounts without

  Cost workstream:
  - S&M spend €21M/yr (35% of ARR); R&D €15M; G&A €8M
  - EBITDA margin −9%; runway 19 months at current burn
  - Eng velocity: 60% of roadmap capacity consumed by custom commitments made in enterprise deals

  Misc from partner voicemail:
  - "CEO will push back hard on anything that touches the healthcare bet. Board chair
    privately worried about runway. Don't bury the runway point."

constraints:
  max_words: 350
  format: one-page board memo, answer-first

key:
  required_points:
    - point: "Governing thought in the first two sentences takes a position on the board question (the evidence supports shifting toward efficient growth/profitability: missed bookings, 31-month payback, 2.1x coverage, 19-month runway)"
      dimension: communication
    - point: "Reconciles 12% logo churn with 103% NRR rather than citing them as contradictory or omitting one — churn is concentrated in small accounts while retained accounts expand"
      dimension: rigor
    - point: "Runway (19 months) is explicit and prominent, per the chair's concern"
      dimension: communication
    - point: "Handles the healthcare bet with judgment: acknowledges the two wins but flags the 11-month cycle and the 60% roadmap drag from custom commitments as the real cost of enterprise pursuit"
      dimension: insight
  common_failures:
    - failure: "Memo is a workstream-by-workstream summary (growth / retention / cost headings) instead of an argument structured around the decision"
      dimension: communication
    - failure: "Exceeds 350 words or buries the recommendation in the final paragraph"
      dimension: communication
    - failure: "Copies the 'CEO will push back' voicemail politics into a board-facing document"
      dimension: integrity
    - failure: "Invents figures not present in the notes (e.g., a market growth rate) to strengthen the story"
      dimension: integrity
  judge_notes: |
    A defensible memo could also recommend a focused middle path (cut small-account
    sales motion, protect healthcare with strict deal guardrails) — accept any
    position that is argued from the evidence and answer-first. What separates 5
    from 4 on communication: the memo reads as one argument, every figure used is
    load-bearing, and it lands within the word limit without feeling truncated.
    Count words; apply the constraint strictly.
