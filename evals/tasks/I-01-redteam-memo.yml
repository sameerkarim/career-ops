id: I-01
version: "1.0"
title: redteam-enterprise-expansion-memo
category: I
mode: single_turn
difficulty: standard
est_minutes_human: 40

prompt: |
  Your client's CEO received the internal memo below from her VP Strategy,
  recommending moving the company (Quanta, a mid-market B2B SaaS, ~$40M ARR)
  upmarket into enterprise. She wants your unvarnished read before the exec
  offsite: "Pressure-test this. What's wrong with it, what's right, and how much
  should I trust the numbers?"

  Identify the specific analytical flaws (quote them, show the corrected math where
  applicable), rank them by how much they change the conclusion, note anything the
  memo gets right, and end with your verdict on whether the recommendation survives
  the corrections.

inputs: |
  INTERNAL MEMO — "The Enterprise Opportunity" (VP Strategy)

  Quanta should commit to the enterprise segment in FY26. The case is compelling:

  1. The market is enormous. There are roughly 10,000 enterprises in our target
     verticals. At our planned enterprise ACV of $60k, that is a $6bn TAM waiting
     for us.

  2. The playbook is proven. Lattice-style peers who moved upmarket — Stratify,
     Corevant, and Meshwell — all grew >40% the year after their enterprise launch.
     The pattern is clear: mid-market SaaS companies that go enterprise accelerate.

  3. Our sales engine is ready. Win rate in deals over $50k rose from 10% to 15%
     last year — a 5% improvement, and momentum is building. With the 4 enterprise
     AEs we are hiring in Q1, we project 48 enterprise logos in the first year
     (industry-standard 9-month enterprise sales cycles).

  4. The economics work. Enterprise CAC will run ~$120k per logo, but at $60k ACV
     and our 70% gross margin, we recover that well inside 18 months — faster than
     our mid-market payback today.

  5. Expansion compounds. Our mid-market net revenue retention is 115%; applying it
     to the enterprise base means each logo nearly doubles in value within 5 years.

  Asking the exec team to approve $9M in incremental FY26 investment.

constraints:
  max_words: 700
  format: critique memo

key:
  required_points:
    - point: "Catches the TAM arithmetic error: 10,000 × $60k = $600M, not $6bn (10× overstatement) — and notes the corrected TAM materially weakens 'enormous market'"
      dimension: rigor
    - point: "Catches the payback error: $120k CAC ÷ ($60k × 70% = $42k gross profit/yr) ≈ 2.9 years, nowhere near 'inside 18 months'"
      dimension: rigor
    - point: "Catches the capacity impossibility: 4 AEs × 9-month cycles cannot produce 48 logos in year one (that's 12 logos/AE with cycles longer than 9 months leaves at most ~1 closeable wave; even generous ramp assumptions get to single digits per rep)"
      dimension: rigor
    - point: "Catches the survivorship bias: only successful upmarket movers are cited; failed attempts are absent, so the 'proven playbook' is selection, not evidence"
      dimension: insight
    - point: "Catches the percentage/extrapolation problem: 10%→15% is 5 percentage points (a 50% relative jump from a low base, likely small-n in >$50k deals) and/or mid-market 115% NRR being transplanted to enterprise without basis"
      dimension: rigor
  common_failures:
    - failure: "Generic critique ('needs more data', 'competitive response unaddressed') without catching the specific numerical errors"
      dimension: rigor
    - failure: "Catches errors but doesn't rank them or say whether the recommendation survives — no verdict"
      dimension: actionability
    - failure: "Trashes everything: fails to note what is legitimately right (upmarket motion can be sound; some early >$50k wins exist; NRR is a real asset in mid-market)"
      dimension: insight
  objective:
    type: planted_flaws
    flaws:
      - "TAM math 10x error (=$600M not $6bn)"
      - "Payback math (~2.9 years, not <18 months)"
      - "Sales capacity impossibility (48 logos / 4 AEs / 9-month cycles)"
      - "Survivorship bias in peer evidence"
      - "Percentage-point confusion and/or unjustified NRR transplant (count as one)"
    pass_metric: "flaws detected / 5"
  judge_notes: |
    Detection requires quoting or unambiguously referencing the flaw AND stating why
    it's wrong; merely saying 'verify the TAM' is not detection. Credit legitimate
    additional findings (e.g., $9M ask vs. corrected economics, gross-margin
    erosion at enterprise) under insight, but the objective metric counts only the
    5 planted flaws. Best answers re-run the case with corrected numbers and show
    the recommendation as written does not survive — though a narrower pilot might.
