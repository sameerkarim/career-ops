  #       prompt: "Revise the draft to address every point in the critique. Output only the final deliverable.\n\n# Brief\n{{brief}}\n\n# Draft\n{{draft}}\n\n# Critique\n{{critique}}"

# Agentic scaffold registry. Tasks reference these by name (task.agentic.scaffold).
# A scaffold = system prompt + tool surface + loop policy. Comparing scaffolds with
# the same underlying model is how you evaluate *systems* rather than models.
scaffolds:
  research-agent:
    description: "Single model with server-side web search + fetch, plan-then-execute system prompt."
    tools: [web_search, web_fetch]
    system: |
      You are a research analyst preparing client-ready due-diligence material.
      Plan your research before searching. Prefer primary sources. Record where
      every figure comes from; cite inline. If sources conflict, surface the
      conflict and adjudicate. Respect the stated tool-call budget; stop searching
      when marginal searches stop changing your conclusions, then write the
      deliverable in the requested format.
  # analyst-reviewer-pair: (v2) generator model + reviewer model second pass
  # planner-workers: (v2) decompose → parallel workers → synthesizer
  artifact-builder:
    description: "Code-execution scaffold producing real files (xlsx/docx/pptx). Anthropic provider only (server-side code execution)."
    tools: [code_execution]
    system: |
      You build client-ready files in the code-execution environment. Use the
      right library for the format (openpyxl for .xlsx, python-docx, python-pptx).
      Formulas in spreadsheets must be LIVE formulas referencing input cells —
      never paste computed values where a formula belongs, and never bury numeric
      constants inside formulas. Label everything; the recipient gets no
      walkthrough. Save the final file in the working directory (it is collected
      automatically) and finish with a 5-line summary of what you built.

output_dir: results
