# Wave manifest — copy to harness/waves/wave-NNN.yml and pin everything.
# A wave's scores are only comparable to other waves that share rubric/judge pins
# (see judges/bias-controls.md for the bridge-wave procedure when pins change).

wave: wave-001
created: 2026-06-10
notes: "Bring-up wave: framework validation, 100% human review."

pins:
  task_dir: tasks # task bank; record the git SHA in `task_sha` at run time
  task_sha: null # filled automatically by `runner.mjs run`
  rubric_version: "1.1" # must match rubrics/core-dimensions.md + weights.yml
  judge_prompt_version: "1.0" # must match judges/absolute-judge.md

# Which tasks to run. Use ids or "all".
tasks: all

# How many times to run each (task × candidate). >1 recommended for noisy/agentic
# tasks; composites are averaged across repeats.
repeats: 1

judge:
  provider: anthropic
  model: claude-opus-4-8
  # Judge always runs with adaptive thinking and structured JSON output; see
  # judges/bias-controls.md §7 for re-judging rules near decision boundaries.
  max_tokens: 16000

# Candidate systems under test — `kind: model` (default) or `kind: pipeline`
# (orchestrated stages; see harness/orchestration.md). Anything affecting
# generation belongs here so the params hash captures it.
#   pricing: $/MTok {input, output} — built in for Anthropic models, required for
#            meaningful cost columns on other providers (0 for local)
#   privacy: free-form tier label (local | cloud-us | cloud-eu | cloud-cn | ...)
candidates:
  - name: claude-opus-4-8
    provider: anthropic
    model: claude-opus-4-8
    privacy: cloud-us
    params:
      max_tokens: 16000
      thinking: adaptive
  - name: claude-sonnet-4-6
    provider: anthropic
    model: claude-sonnet-4-6
    privacy: cloud-us
    params:
      max_tokens: 16000
      thinking: adaptive
  - name: claude-haiku-4-5
    provider: anthropic
    model: claude-haiku-4-5
    privacy: cloud-us
    params:
      max_tokens: 8000

  # --- Other providers: one openai-compatible adapter covers OpenAI, Gemini
  # (OpenAI-compat endpoint), DeepSeek/Qwen/Moonshot, Groq, OpenRouter, and all
  # local servers (Ollama, vLLM, LM Studio). See harness/orchestration.md.
