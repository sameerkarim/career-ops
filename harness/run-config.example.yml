  #   base_url: http://localhost:11434/v1
  #   model: qwen3:32b
  #   pricing: { input: 0, output: 0 }
  #   privacy: local

  # --- Orchestration example: local drafts + cheap frontier review. Compare
  # against a frontier solo run on the same wave to measure the quality gap vs.
  # cost/privacy gain. Full pattern library: harness/orchestration.md.
  # - name: local-mix
